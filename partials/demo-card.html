<!--
  Tarjeta del formulario de demo (sin la sección que la envuelve).
  La usan partials/form.html (página de flota) y partials/registro.html
  (home y operacional, como acción secundaria de la prueba gratis).
  Parámetros: vertical · precioClase · precioDestacado · precioResto
-->
  <div class="rounded-2xl border border-space-edge bg-card-mid/80 p-6 shadow-2xl backdrop-blur-md sm:p-8">
    <!-- Pricing Reference -->
    <div
      class="mb-6 rounded-lg border border-violet-primary/20 bg-violet-primary/5 p-3 text-center text-xs text-slate-600 {{precioClase}}">
      <span class="font-semibold text-violet-primary">{{precioDestacado}}</span> {{precioResto}}
    </div>

    <form id="contact-form" class="space-y-5" novalidate>
      <!-- De qué página vino el lead -->
      <input type="hidden" id="vertical" name="vertical" value="{{vertical}}" />

      <!-- Name -->
      <div>
        <label for="name" class="mb-1.5 block text-sm font-medium text-gray-300">Nombre</label>
        <input id="name" name="name" type="text" required autocomplete="name"
          class="w-full rounded-lg border border-space-edge bg-space-deep/60 px-4 py-3 text-sm text-white placeholder-gray-500 outline-none transition-all duration-200 focus:border-violet-primary focus:ring-2 focus:ring-violet-primary/40"
          placeholder="Tu nombre" />
        <p class="mt-1 hidden text-xs text-pink-accent" data-error="name">Por favor ingresá tu nombre.</p>
      </div>

      <!-- WhatsApp -->
      <div>
        <label for="whatsapp" class="mb-1.5 block text-sm font-medium text-gray-300">WhatsApp</label>
        <input id="whatsapp" name="whatsapp" type="tel" required autocomplete="tel"
          class="w-full rounded-lg border border-space-edge bg-space-deep/60 px-4 py-3 text-sm text-white placeholder-gray-500 outline-none transition-all duration-200 focus:border-violet-primary focus:ring-2 focus:ring-violet-primary/40"
          placeholder="Ej: +54 9 11 1234 5678" />
        <p class="mt-1 hidden text-xs text-pink-accent" data-error="whatsapp">Por favor ingresá tu número de
          WhatsApp.</p>
      </div>

      <!-- Submit -->
      <button id="submit-btn" type="submit"
        class="group relative w-full cursor-pointer overflow-hidden rounded-lg bg-gradient-to-r from-violet-primary to-pink-accent px-6 py-3.5 text-sm font-semibold text-white shadow-lg transition-all duration-300 hover:shadow-violet-primary/30 hover:shadow-xl active:scale-[0.98]">
        <span id="btn-text">Quiero mi demo gratuita →</span>
        <span id="btn-loading" class="hidden items-center justify-center gap-2">
          <svg class="h-5 w-5 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" class="opacity-25"></circle>
            <path d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" fill="currentColor" class="opacity-75"></path>
          </svg>
          Enviando...
        </span>
      </button>
    </form>

    <!-- Contact note -->
    <p class="mt-4 text-center text-xs leading-relaxed text-gray-400">
      Alguien del equipo se pondrá en contacto con vos rápidamente.
      Al enviar aceptás nuestra <a href="/privacidad/" class="underline hover:text-violet-primary">política de
        privacidad</a>.
    </p>

    <!-- Success message -->
    <div id="form-success" class="hidden py-8 text-center">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-teal-accent/20">
        <svg class="h-8 w-8 text-teal-accent" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h3 class="text-xl font-bold text-white">¡Mensaje enviado!</h3>
      <p class="mt-2 text-sm text-gray-400">Un especialista de CoreUp te contactará pronto.</p>
    </div>
  </div>
