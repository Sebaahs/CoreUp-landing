<!--#
  Cabecera de las páginas de pedido (arrepentimiento / baja) y de las legales nuevas.
  Sin píxel de Meta ni Open Graph: no son páginas de campaña.
  Parámetros: titulo · descripcion · ruta · robots (index, follow | noindex, follow)
-->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>{{titulo}}</title>
<meta name="description" content="{{descripcion}}" />
<meta name="robots" content="{{robots}}" />
<link rel="canonical" href="{{site}}{{ruta}}" />

<meta name="theme-color" content="#e6ebff" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
