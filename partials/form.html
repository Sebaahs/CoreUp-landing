<!--
  Formulario de demo (sección completa). Hoy lo usa solo /flota; home y
  /operacional usan partials/registro.html, que lo ofrece como acción secundaria.
  Parámetros:
    vertical         — viaja al Apps Script para saber de qué página vino el lead
    bajada           — la línea bajo el título
    precioClase      — "hidden" para ocultar el bloque de precio (ej. mientras Flota no tenga precio definido)
    precioDestacado  — ej. "Desde $160.000 ARS/mes."
    precioResto      — ej. "Pensado para pymes y emprendedores."
-->
<section id="contact" class="relative flex min-h-screen items-center justify-center bg-space-deep px-4 py-20">
  <div id="form-wrapper" class="relative z-10 mx-auto w-full max-w-lg opacity-0" style="transform: translateY(60px);">
    <div class="text-center">
      <span class="mb-4 inline-block text-sm font-semibold tracking-widest text-pink-accent uppercase">Empezá
        hoy</span>
      <h2 class="text-2xl font-bold text-white sm:text-3xl md:text-4xl leading-tight">
        Agendá tu demo gratuita
      </h2>
      <p class="mx-auto mt-4 mb-8 max-w-md text-sm text-gray-400">
        {{bajada}}
      </p>
    </div>

    <!--@include partials/demo-card.html vertical="{{vertical}}" precioClase="{{precioClase}}" precioDestacado="{{precioDestacado}}" precioResto="{{precioResto}}" -->
  </div>
</section>
